name: 功能建议
description: 提出使用场景、接口需求或改进方案
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有建议，并查看 [文档导航](https://github.com/l52312516-cell/Freshwater-dolphin/blob/main/docs/README.md)。
        如需补充 QQAPI，请提供公开接口说明或脱敏请求示例；其他适配器支持某接口并不能证明当前 QQ build 可用。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景与当前困难
      description: 说明谁在什么情况下需要它，以及当前行为带来的具体影响。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或改善的行为
      description: 尽量给出输入与预期输出。接口建议请填写 action、参数类型和返回契约。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可接受的替代方案
      description: 如已有手动办法、其他参数组合或兼容行为，请一并说明。
  - type: textarea
    id: reference
    attributes:
      label: 环境、公开参考与验证条件
      description: 可填写目标平台、QQ 完整 build、OneBot 客户端版本、公开文档链接，以及可供自行验证的测试场景。不要提供他人私密数据或账号凭据。
  - type: checkboxes
    id: privacy
    attributes:
      label: 发布前检查
      options:
        - label: 我已检查正文和附件，不含账号密码、token、Cookie、登录数据或私人聊天内容。
          required: true
